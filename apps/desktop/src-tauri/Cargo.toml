[package]
name = "storymaker"
version = "0.1.0"
description = "A quiet desktop room for worlds, stories, and local writing companions."
authors = ["StoryMaker"]
edition = "2021"

[lib]
name = "storymaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
